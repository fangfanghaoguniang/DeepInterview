name: Deploy

# NAS single-machine deploy. CI (ci.yml) runs the checks; this workflow ships
# the tested commit to the running compose stack on the NAS.
#
# Topology facts this file depends on:
#   - The deploy job runs ONLY on the NAS self-hosted runner (label `nas`).
#     If the NAS is offline the job queues until it returns — it must never
#     fall back to a GitHub-hosted runner, which has no stack to update.
#   - CI keeps `ubuntu-latest`, so it can still run on GitHub-hosted runners
#     when the NAS is down (checks survive; only deploys wait).
#   - The compose project lives in $NAS_DEPLOY_DIR on the NAS (repo Settings ->
#     Actions -> Variables, e.g. /volume1/@home/DeepInterview). That directory
#     is a git clone of this repo; .env there is gitignored, so `git checkout`
#     never touches the keys.
#
# Trigger: automatic after a SUCCESSFUL CI run on main (workflow_run), plus a
# manual fallback for re-deploying the current main.
#
# The `production` environment is referenced but intentionally ships WITHOUT
# required reviewers (push -> CI -> deploy stays fully automatic). To add a
# human approval gate later, enable required reviewers on the `production`
# environment in repo Settings — no file change needed.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-nas
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-nas:
    name: Deploy to NAS (compose)
    # Only the NAS runner carries the `nas` label (register it with
    # `--labels ubuntu-latest,nas`). A GitHub-hosted runner must never take
    # this job — it has no compose stack to update.
    runs-on: [self-hosted, nas]
    environment: production
    steps:
      # workflow_run fires for FAILED CI runs too — the conclusion check is
      # what keeps a red build from ever reaching the stack.
      - name: Resolve the commit that passed CI
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            conc="${{ github.event.workflow_run.conclusion }}"
            if [ "$conc" != "success" ]; then
              echo "CI conclusion=$conc — not deploying."
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            # Manual dispatch: deploy whatever the runner's checkout is at.
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      # Detached-checkout the EXACT commit CI validated (not "latest main"),
      # so a commit pushed mid-deploy can't sneak in untested. The detached
      # HEAD state in the deploy dir is expected; the next deploy moves it on.
      - name: Update the deploy checkout to the tested commit
        if: steps.sha.outputs.enabled == 'true'
        env:
          DEPLOY_DIR: ${{ vars.NAS_DEPLOY_DIR }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          cd "$DEPLOY_DIR"
          git fetch origin main
          git checkout "$SHA"

      # Incremental by design: compose rebuilds only the images whose sources
      # changed (layer cache), then recreates only the affected containers.
      - name: Rebuild + restart the stack (incremental)
        if: steps.sha.outputs.enabled == 'true'
        env:
          DEPLOY_DIR: ${{ vars.NAS_DEPLOY_DIR }}
        run: |
          cd "$DEPLOY_DIR"
          docker compose --profile live up -d --build

      # Fail loudly rather than half-live: if either health endpoint is down
      # the run goes red. Rollback by hand (SSH to the NAS):
      #   git checkout <last-good-sha> && docker compose --profile live up -d --build
      # Old images stay in the local cache, so the rebuild is fast.
      - name: Health check
        if: steps.sha.outputs.enabled == 'true'
        run: |
          curl -fsS http://127.0.0.1:3000/api/health
          curl -fsS http://127.0.0.1:8000/health
